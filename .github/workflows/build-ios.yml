name: iOS Build & TestFlight

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Archive & Upload
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version && xcodebuild -showsdks | grep iphoneos

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import signing certificate into keychain
        env:
          P12_BASE64: ${{ secrets.APPLE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          KEYCHAIN_PWD: temporary-build-keychain
        run: |
          CERT_PATH="$RUNNER_TEMP/build_cert.p12"
          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain-db
          security import "$CERT_PATH" \
            -k build.keychain-db -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s build.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "$KEYCHAIN_PWD" build.keychain-db

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
        run: |
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -o - -)
          cp "$RUNNER_TEMP/profile.mobileprovision" "$PP_DIR/$UUID.mobileprovision"
          echo "Installed profile UUID=$UUID"

      - name: Archive (Release)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project QiuYuAI.xcodeproj \
            -scheme QiuYuAI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/QiuYuAI.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | grep -E "error|warning: |ARCHIVE" || true
          test -d "$RUNNER_TEMP/QiuYuAI.xcarchive"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/QiuYuAI.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates false
          ls -la "$RUNNER_TEMP/ipa"

      - name: Upload IPA to TestFlight
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_API_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          IPA=$(ls "$RUNNER_TEMP/ipa/"*.ipa | head -1)
          echo "Uploading $IPA ..."
          xcrun altool --upload-app \
            -f "$IPA" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER" \
            --type ios

      - name: Attach IPA as artifact (backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QiuYuAI-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30
