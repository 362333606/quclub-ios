name: iOS AdHoc Direct Install

on:
  workflow_dispatch:

jobs:
  build:
    name: Archive AdHoc
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import signing certificate into keychain
        env:
          P12_BASE64: ${{ secrets.APPLE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          KEYCHAIN_PWD: temporary-build-keychain
        run: |
          CERT_PATH="$RUNNER_TEMP/build_cert.p12"
          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain-db
          security import "$CERT_PATH" \
            -k build.keychain-db -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s build.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "$KEYCHAIN_PWD" build.keychain-db

      - name: Install provisioning profile (AdHoc)
        env:
          PROFILE_BASE64: ${{ secrets.ADHOC_PROFILE_BASE64 }}
        run: |
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -o - -)
          cp "$RUNNER_TEMP/profile.mobileprovision" "$PP_DIR/$UUID.mobileprovision"
          echo "Installed AdHoc profile UUID=$UUID"

      - name: Archive (Release, AdHoc)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project QiuYuAI.xcodeproj \
            -scheme QiuYuAI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/QiuYuAI.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            PROVISIONING_PROFILE_SPECIFIER="QiuYu AdHoc 20260903" \
            | grep -E "error|warning: |ARCHIVE" || true
          test -d "$RUNNER_TEMP/QiuYuAI.xcarchive"

      - name: Export IPA (ad-hoc)
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/QiuYuAI.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist ExportOptions-adhoc.plist
          ls -la "$RUNNER_TEMP/ipa"

      - name: Attach IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: QiuYuAI-adhoc-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30
