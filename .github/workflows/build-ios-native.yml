name: iOS Native Build (趣club uni-app离线打包)

on:
  workflow_dispatch:

env:
  APPID: ${{ secrets.DCLOUD_APPID }}
  APPKEY: ${{ secrets.DCLOUD_IOS_APPKEY }}
  BUNDLE_ID: cn.qyai001.quclub
  PROFILE_NAME: QuClub AdHoc 20260904
  TEAM_ID: KD737T5M5W

jobs:
  build:
    name: 离线打包 AdHoc
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. www 资源(仓库内已编好的 app-plus 产物) ──
      - name: Check www
        run: |
          test -f www/app-service.js && test -f www/manifest.json
          ls www/ | head -25

      # ── 2. 下载 iOS 离线 SDK (Release 资产) ──
      - name: Download iOS SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download native-sdk -R "$GITHUB_REPOSITORY" -p 'iOS-SDK*.zip' -O /tmp/iOS-SDK.zip
          ls -la /tmp/iOS-SDK.zip
          mkdir -p /tmp/sdk && cd /tmp/sdk
          unzip -q /tmp/iOS-SDK.zip -d out  # 净版: SDK/, HBuilder-Hello/ ...
          ls out/
          ls out/SDK/ | head

      # ── 3. 组装: www + control.xml + bundle id ──
      - name: Assemble project
        run: |
          HB=/tmp/sdk/out/SDK/HBuilder-Hello
          APP_DIR="$HB/HBuilder-Hello/Pandora/apps/$APPID"
          rm -rf "$HB/HBuilder-Hello/Pandora/apps/__UNI__33C5XXX" "$HB/HBuilder-Hello/Pandora/apps/__UNI__2302A5F"
          mkdir -p "$APP_DIR/www"
          cp -R www/. "$APP_DIR/www/"
          ls "$APP_DIR/www/" | head -8
          test -f "$APP_DIR/www/manifest.json" || { echo "www拷贝失败"; exit 1; }
          # manifest.json 的 id 替换为新 appid(与 Pandora 目录一致)
          echo "APP_DIR长度: ${#APP_DIR}"
          find "$HB/HBuilder-Hello/Pandora/apps" -maxdepth 2 -type d | head -5
          APP_DIR="$APP_DIR" APPID="$APPID" python3 - <<'PY'
          import json, os, glob
          d = os.environ['APP_DIR']
          print('python APP_DIR repr:', repr(d[-20:]))
          p = os.path.join(d, 'www', 'manifest.json')
          print('manifest存在:', os.path.exists(p))
          if not os.path.exists(p):
              cand = glob.glob(os.path.join(d, 'www', 'manifest.json'))
              print('glob:', cand)
              raise SystemExit(1)
          m = json.load(open(p))
          m['id'] = os.environ['APPID']
          json.dump(m, open(p, 'w'), ensure_ascii=False, indent=2)
          print('manifest id ->', m['id'])
          PY
          # control.xml: appid + appkey + 关debug
          cat > "$HB/HBuilder-Hello/control.xml" <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <HBuilder debug="false" version="5.25.2026082902">
            <apps>
              <app appid="$APPID" appver="2.0.0" appkey="$APPKEY"/>
            </apps>
          </HBuilder>
          XML
          # bundle id
          python3 - <<'PY'
          p = '/tmp/sdk/out/SDK/HBuilder-Hello/HBuilder-Hello.xcodeproj/project.pbxproj'
          c = open(p).read()
          c = c.replace('com.dcloud.XXX', 'cn.qyai001.quclub').replace('io.dcloud.HBuilder', 'cn.qyai001.quclub')
          open(p, 'w').write(c)
          print('bundle id ok')
          PY
          # 显示名
          plutil -replace CFBundleDisplayName -string "趣club" "$HB/HBuilder-Hello/Info.plist" 2>/dev/null || true
          plutil -replace CFBundleName -string "趣club" "$HB/HBuilder-Hello/Info.plist" 2>/dev/null || true

      # ── 4. 签名材料 ──
      - name: Import certificate & profile
        env:
          P12_B64: ${{ secrets.APPLE_P12_BASE64 }}
          P12_PWD: ${{ secrets.APPLE_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.ADHOC_PROFILE_BASE64 }}
        run: |
          CERT_PATH="$RUNNER_TEMP/build_cert.p12"
          echo "$P12_B64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p temporary-build-keychain build.keychain-db
          security import "$CERT_PATH" -k build.keychain-db -P "$P12_PWD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s build.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k temporary-build-keychain build.keychain-db
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -o - -)
          cp "$RUNNER_TEMP/profile.mobileprovision" "$PP_DIR/$UUID.mobileprovision"
          echo "profile UUID=$UUID"

      # ── 5. pod install ──
      - name: CocoaPods install
        working-directory: /tmp/sdk/out/SDK/HBuilder-Hello
        run: |
          pod install --repo-update

      # ── 6. Archive ──
      - name: Archive (AdHoc)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          cd /tmp/sdk/out/SDK/HBuilder-Hello
          xcodebuild archive \
            -workspace HBuilder-Hello.xcworkspace \
            -scheme HBuilder \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/QuClub.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION=2.0.0 \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            | grep -E "error|warning: |ARCHIVE" || true
          test -d "$RUNNER_TEMP/QuClub.xcarchive"

      - name: Export IPA (ad-hoc)
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${{ env.TEAM_ID }}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>cn.qyai001.quclub</key><string>${{ env.PROFILE_NAME }}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/QuClub.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls -la "$RUNNER_TEMP/ipa"

      - name: Attach IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: quclub-native-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30
