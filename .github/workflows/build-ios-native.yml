name: iOS Native Build (趣club v9.5:修登录页族APP高度链断裂偏顶)

on:
  workflow_dispatch:

env:
  APPID: ${{ secrets.DCLOUD_APPID }}
  APPKEY: ${{ secrets.DCLOUD_IOS_APPKEY }}
  BUNDLE_ID: cn.qyai001.quclub
  PROFILE_NAME: QuClub AdHoc 20260904
  TEAM_ID: KD737T5M5W

jobs:
  build:
    name: 离线打包 AdHoc
    runs-on: macos-15
    permissions:
      contents: write   # Publish release步骤需要(job默认token只读)
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. CI内编译www(编译器50205线对齐SDK5.25,修5.24/5.25不匹配白屏+弹窗) ──
      - uses: actions/setup-node@v4
        with:
          node-version: '16'
      - name: Extract app source
        run: |
          mkdir -p app && tar xzf app-src.tar.gz -C app
          ls app/ | head -8
          test -f app/package.json
      - name: Build uni-app www
        working-directory: app
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          rm -rf node_modules/@vue/component-compiler-utils
          cp -r node_modules/@dcloudio/vue-cli-plugin-uni/packages/@vue/component-compiler-utils node_modules/@vue/component-compiler-utils
          npm run build:app-plus
          test -f dist/build/app-plus/app-service.js

      # ── 2. 下载 iOS 离线 SDK (Release 资产, 带缓存) ──
      - name: Cache iOS SDK zip
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: /tmp/iOS-SDK.zip
          key: native-sdk-ios-525-clean-v1
      - name: Download iOS SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download native-sdk -R "$GITHUB_REPOSITORY" -p 'iOS-SDK*.zip' -O /tmp/iOS-SDK.zip
          ls -la /tmp/iOS-SDK.zip
      - name: Unzip & verify iOS SDK
        run: |
          mkdir -p /tmp/sdk && cd /tmp/sdk
          unzip -q /tmp/iOS-SDK.zip -d out || true   # 净版: 根目录是 SDK/ (__MACOSX杂质会致warning退出码,容忍)
          ls out/SDK/ | head
          # 强校验(纯bash): 关键文件在+体积够(zip64空壳坑)
          test -f out/SDK/uniapp.podspec || { echo 'FATAL: 缺uniapp.podspec'; exit 1; }
          test -f out/SDK/HBuilder-Hello/Podfile || { echo 'FATAL: 缺Podfile'; exit 1; }
          test -f out/SDK/HBuilder-Hello/HBuilder-Hello/control.xml || { echo 'FATAL: 缺control.xml'; exit 1; }
          SDK_MB=$(du -sm out/ | cut -f1)
          echo "SDK展开 ${SDK_MB}MB"
          [ "$SDK_MB" -gt 1400 ] || { echo 'FATAL: SDK体积异常'; exit 1; }
          echo 'SDK校验通过'

      # ── 3. 组装: www + control.xml + bundle id + scheme (妹妹配方) ──
      - name: Assemble project
        run: |
          HB=/tmp/sdk/out/SDK/HBuilder-Hello
          APP_ROOT="$HB/HBuilder-Hello"
          APP_DIR="$APP_ROOT/Pandora/apps/$APPID"
          rm -rf "$APP_ROOT/Pandora/apps/"*/
          mkdir -p "$APP_DIR/www"
          cp -R app/dist/build/app-plus/. "$APP_DIR/www/"
          test -f "$APP_DIR/www/manifest.json" || { echo www拷贝失败; exit 1; }
          # www内appid对齐$APPID(源工程manifest自带9CDF755)
          sed -i.bak "s|\"__UNI__[A-Z0-9]*\"|\"$APPID\"|g" "$APP_DIR/www/manifest.json" && rm -f "$APP_DIR/www/manifest.json.bak"
          grep -o "\"__UNI__[A-Z0-9]*\"" "$APP_DIR/www/manifest.json" | head -1
          cat > "$APP_ROOT/control.xml" <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <HBuilder debug="false" version="5.25.2026082902">
            <apps>
              <app appid="$APPID" appver="2.1.5" appkey="$APPKEY"/>
            </apps>
          </HBuilder>
          XML
          python3 - <<'PY'
          # bundle id + Podfile两砍(定位UTS插件链接不匹配/外部specs大仓)——妹妹验证过的配方
          p = '/tmp/sdk/out/SDK/HBuilder-Hello/HBuilder-Hello.xcodeproj/project.pbxproj'
          c = open(p).read()
          c = c.replace('com.dcloud.XXX', 'cn.qyai001.quclub').replace('io.dcloud.HBuilder', 'cn.qyai001.quclub')
          open(p, 'w').write(c)
          print('bundle id ok')
          pf = '/tmp/sdk/out/SDK/HBuilder-Hello/Podfile'
          c2 = open(pf).read()
          assert "'Geolocation-Tencent'," in c2, 'Podfile锚点没找到'
          c2 = c2.replace("   'Geolocation-Tencent',", "   # 'Geolocation-Tencent', # 砍:UTS插件Xcode16.4链接符号不匹配;坐标走系统核心定位,地址走后端/ws/geocoder逆地理")
          c2 = c2.replace("source 'https://github.com/CocoaPods/Specs.git'", "# source砍:本地:path依赖不需要")
          c2 = c2.replace("source 'https://github.com/volcengine/volcengine-specs.git'", "# source砍:同上")
          open(pf, 'w').write(c2)
          print('Podfile已砍Geolocation-Tencent+外部specs')
          PY
          # 共享scheme(demo不带xcshareddata;不手工建则xcodebuild自动scheme会编全部demo targets=3小时挂死根因)
          mkdir -p "$HB/HBuilder-Hello.xcodeproj/xcshareddata/xcschemes"
          cat > "$HB/HBuilder-Hello.xcodeproj/xcshareddata/xcschemes/HBuilder.xcscheme" <<'SCHEME'
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme version = "1.3">
             <BuildAction parallelizableBuildType = "YES" buildImplicitDependencies = "YES">
                <BuildActionEntries>
                   <BuildActionEntry buildForTesting = "YES" buildForRunning = "YES" buildForProfiling = "YES" buildForArchiving = "YES" buildForAnalyzing = "YES">
                      <BuildableReference BuildableIdentifier = "primary" BlueprintIdentifier = "8EED6297198A1D13000A4449" BuildableName = "HBuilder.app" BlueprintName = "HBuilder" ReferencedContainer = "container:HBuilder-Hello.xcodeproj"></BuildableReference>
                   </BuildActionEntry>
                </BuildActionEntries>
             </BuildAction>
             <ArchiveAction buildConfiguration = "Release" revealArchiveInOrganizer = "YES"></ArchiveAction>
          </Scheme>
          SCHEME
          # App图标(demo的AppIcon.appiconset是空目录=空白logo根因;注入v1.0.2同款品牌图标)
          # 图标:注入pbxproj实际引用的HBuilder/Images.xcassets(v7注错目录致无Assets.car)+HBuilder-Hello/双保险
          # v9(2026-09-04): ios-shell/icon1024.png已换成纯趣club logo满幅图(去掉紫色合成底),同时注入LaunchLogo启动图用
          for XC in "$HB/HBuilder/Images.xcassets" "$HB/HBuilder-Hello/Images.xcassets"; do
            ICONSET="$XC/AppIcon.appiconset"
            mkdir -p "$ICONSET"
            cp "$GITHUB_WORKSPACE/ios-shell/icon1024.png" "$ICONSET/icon1024.png"
            cat > "$ICONSET/Contents.json" <<'JSON'
          {
            "images" : [ { "filename" : "icon1024.png", "idiom" : "universal", "platform" : "ios", "size" : "1024x1024" } ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON
          done
          # 启动图净化(v9.1外科手术): 删「HBuilder Hello」标签+其约束,覆盖dclogo/app图片为品牌logo,logo垂直居中
          # (v9整文件替换storyboard导致ibtool CompileStoryboard失败;改为对原XML做最小文本手术,结构零改动)
          python3 - <<'PY'
          import re
          sbs = [
              '/tmp/sdk/out/SDK/HBuilder-Hello/HBuilder-Hello/LaunchScreen.storyboard',
              '/tmp/sdk/out/SDK/HBuilder-Hello/HBuilder-Hello/Base.lproj/LaunchScreen.storyboard',
          ]
          for sb in sbs:
              c = open(sb).read()
              c2 = re.sub(r'<label[^>]*text="HBuilder Hello".*?</label>\s*', '', c, flags=re.S)
              c2 = re.sub(r'<constraint[^>]*"(?:firstItem|secondItem)="lAp-n0-0hk"[^>]*/>\s*', '', c2)
              # v2.1.3: top固定常量293在大屏(iPhone16PM 956pt)上偏上——改centerY约束真居中(适配任意屏高)
              c2 = re.sub(r'<constraint firstItem="chI-mp-JJn" firstAttribute="top"[^/>]*/>', '<constraint firstItem="chI-mp-JJn" firstAttribute="centerY" secondItem="z0m-pv-cfa" secondAttribute="centerY" id="qC0-Center-Y26"/>', c2)
              open(sb, 'w').write(c2)
              print(sb, '净化后含HBuilder Hello:', 'HBuilder Hello' in c2)
          PY
          # 覆盖启动图用的小图(dclogo=根storyboard引用 / app=Base.lproj引用),243px品牌logo,显示81pt清晰
          for IMG in dclogo.png dclogo@2x.png dclogo@3x.png app.png; do
            cp "$GITHUB_WORKSPACE/ios-shell/launchlogo243.png" "$APP_ROOT/$IMG"
          done
          echo '启动图处理完成'
          # 显示名(demo的plist名是HBuilder-Hello-Info.plist)+本地化(不改会显示hbuilder你好)
          plutil -replace CFBundleDisplayName -string "趣club" "$APP_ROOT/HBuilder-Hello-Info.plist"
          plutil -replace CFBundleName -string "趣club" "$APP_ROOT/HBuilder-Hello-Info.plist"
          printf 'CFBundleDisplayName="趣club";\n' > "$APP_ROOT/zh-Hans.lproj/InfoPlist.strings"
          printf 'CFBundleDisplayName="趣club";\n' > "$APP_ROOT/en.lproj/InfoPlist.strings"

      # ── 4. 签名材料(双路径装profile, Xcode16起老目录废弃) ──
      - name: Import certificate & profile
        env:
          P12_B64: ${{ secrets.APPLE_P12_BASE64 }}
          P12_PWD: ${{ secrets.APPLE_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.ADHOC_PROFILE_BASE64 }}
        run: |
          CERT_PATH="$RUNNER_TEMP/build_cert.p12"
          echo "$P12_B64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p temporary-build-keychain build.keychain-db
          security import "$CERT_PATH" -k build.keychain-db -P "$P12_PWD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s build.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k temporary-build-keychain build.keychain-db
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -o - -)
          PP_OLD="$HOME/Library/MobileDevice/Provisioning Profiles"
          PP_NEW="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PP_OLD" "$PP_NEW"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$PP_OLD/$UUID.mobileprovision"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$PP_NEW/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "profile UUID=$UUID 已装双路径"

      # ── 5. pod install + post_install禁签名注入(本地:path依赖) ──
      - name: CocoaPods install
        working-directory: /tmp/sdk/out/SDK/HBuilder-Hello
        run: |
          python3 - <<'PY'
          c = open('Podfile').read()
          old = "post_install do |installer|\n  UniAppModuleConfig.apply("
          new = """post_install do |installer|
            installer.pods_project.build_configurations.each do |config|
              config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              config.build_settings['CODE_SIGNING'] = 'NO'
            end
            UniAppModuleConfig.apply("""
          assert old in c, 'Podfile post_install锚点没找到'
          open('Podfile','w').write(c.replace(old, new))
          print('Podfile已注入禁签名')
          PY
          pod install

      # ── 6. Archive ──
      - name: Archive (AdHoc)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd /tmp/sdk/out/SDK/HBuilder-Hello
          set -o pipefail
          xcodebuild archive \
            -workspace HBuilder-Hello.xcworkspace \
            -scheme HBuilder \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/QuClub.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION=2.1.5 \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            > /tmp/archive.log 2>&1 || { echo '=== archive失败,最后80行 ==='; tail -80 /tmp/archive.log; exit 1; }
          echo '=== archive结果 ==='; tail -5 /tmp/archive.log
          test -d "$RUNNER_TEMP/QuClub.xcarchive"

      - name: Always upload archive log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-log-${{ github.run_number }}
          path: /tmp/archive.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Export IPA (ad-hoc)
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${{ env.TEAM_ID }}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>cn.qyai001.quclub</key><string>${{ env.PROFILE_UUID }}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/QuClub.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            > /tmp/export.log 2>&1 || { echo '=== export失败,最后60行 ==='; tail -60 /tmp/export.log; exit 1; }
          ls -la "$RUNNER_TEMP/ipa"

      - name: Verify IPA (图标+启动图硬校验,v7教训)
        run: |
          IPA=$(ls "$RUNNER_TEMP/ipa/"*.ipa)
          unzip -l "$IPA" | grep -E "Assets\.car|LaunchScreen" || { echo 'FATAL: 缺Assets.car或LaunchScreen'; exit 1; }
          rm -rf /tmp/ipax && mkdir /tmp/ipax && unzip -q "$IPA" -d /tmp/ipax
          APP=$(ls -d /tmp/ipax/Payload/*.app)
          test -f "$APP/Assets.car" || { echo 'FATAL: Assets.car不存在'; exit 1; }
          SB=$(find "$APP" -name 'LaunchScreen.storyboardc' | head -1)
          echo "storyboardc: $SB"
          if strings "$SB" 2>/dev/null | grep -q 'HBuilder Hello'; then
            echo 'FATAL: 启动图仍含HBuilder Hello'; exit 1
          fi
          echo 'IPA校验通过: Assets.car在+启动图已净化'

      - name: Attach IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: quclub-native-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30

      # 公开Release资产免认证直下(妹妹配方20260904)——PAT会被公开仓库安全扫描吊销,
      # artifact API需认证;发Release后119直接curl下载部署,全程不依赖PAT
      - name: Publish release (ipa免认证直下)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.1.5-r${{ github.run_number }}"
          gh release create "$TAG" "$RUNNER_TEMP/ipa/"*.ipa \
            -R "$GITHUB_REPOSITORY" --title "QuClub $TAG" --latest \
            --notes "v2.1.5:修登录/注册/找回/绑定手机四页在APP上内容全部偏顶不居中——uni-page高度链断裂,补page高度+100vh" || echo 'release创建失败不阻塞artifact'
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].browser_download_url' || true
